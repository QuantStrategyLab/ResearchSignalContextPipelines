name: Theme Momentum Snapshot

on:
  workflow_dispatch:
    inputs:
      identity_only:
        description: "Verify the configured publisher identity only; no collection, data changes, or PR. Main only."
        required: false
        default: false
        type: boolean
      as_of:
        description: "Optional YYYY-MM-DD cutoff. Empty uses latest available/downloaded price date."
        required: false
        type: string
      prices_path:
        description: "Optional local price CSV path. Empty downloads Yahoo chart data as a temporary fallback."
        required: false
        default: ""
        type: string
      strict_downloads:
        description: "Fail if any downloaded symbol is unavailable."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      commit_outputs:
        description: "Commit generated theme_momentum_snapshot.json back to data/output."
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # Refresh before the advisory publication workflow. The script records data
    # source and hash metadata; downstream use remains research-only.
    - cron: "45 11 * * 6"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-theme-momentum:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Manual diagnostic only. Normal generation and publication behavior is unchanged.
      - name: Check trusted publisher identity context
        id: publisher_identity_preflight
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.identity_only }}
        env:
          RESEARCH_PUBLISHER_APP_ID: ${{ vars.RESEARCH_PUBLISHER_APP_ID }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          expected_repository = "QuantStrategyLab/ResearchSignalContextPipelines"
          expected_workflow_ref = expected_repository + "/.github/workflows/theme_momentum_snapshot.yml@refs/heads/main"
          app_id_matches = os.environ.get("RESEARCH_PUBLISHER_APP_ID") == "5214420"
          repository_id = os.environ.get("GITHUB_REPOSITORY_ID", "")
          context_matches = (
              os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch"
              and os.environ.get("GITHUB_REF") == "refs/heads/main"
              and os.environ.get("GITHUB_REPOSITORY") == expected_repository
              and os.environ.get("GITHUB_WORKFLOW_REF") == expected_workflow_ref
              and repository_id.isascii() and repository_id.isdecimal()
              and int(repository_id) > 0
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"app_id_matches={str(app_id_matches).lower()}\n")
          if not (app_id_matches and context_matches):
              print("PUBLISHER_IDENTITY_PREFLIGHT_FAILED")
              raise SystemExit(1)
          print("PUBLISHER_IDENTITY_PREFLIGHT_OK")
          PY
      - name: Create single-repository publisher identity token
        id: publisher_identity_token
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.identity_only }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RESEARCH_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.RESEARCH_PUBLISHER_APP_PRIVATE_KEY }}
          owner: QuantStrategyLab
          repositories: ResearchSignalContextPipelines
          permission-contents: write
          permission-pull-requests: write
      - name: Verify publisher installation and repository scope
        id: publisher_identity_verify
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.identity_only }}
        env:
          RESEARCH_PUBLISHER_INSTALLATION_ID: ${{ steps.publisher_identity_token.outputs.installation-id }}
          RESEARCH_PUBLISHER_TOKEN: ${{ steps.publisher_identity_token.outputs.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          installation_matches = os.environ.get("RESEARCH_PUBLISHER_INSTALLATION_ID") == "168603414"
          scope_matches = False
          verified = False
          try:
              token = os.environ.get("RESEARCH_PUBLISHER_TOKEN", "")
              if installation_matches and token:
                  request = urllib.request.Request(
                      "https://api.github.com/installation/repositories?per_page=100",
                      headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"},
                      method="GET",
                  )
                  with urllib.request.build_opener(NoRedirect()).open(request, timeout=20) as response:
                      raw = response.read(1024 * 1024 + 1)
                      if response.status == 200 and not response.headers.get("Link") and len(raw) <= 1024 * 1024:
                          payload = json.loads(raw)
                          if type(payload) is dict and type(payload.get("total_count")) is int and payload["total_count"] == 1:
                              repositories = payload.get("repositories")
                              if type(repositories) is list and len(repositories) == 1 and type(repositories[0]) is dict:
                                  repository = repositories[0]
                                  scope_matches = (
                                      repository.get("full_name") == "QuantStrategyLab/ResearchSignalContextPipelines"
                                      and type(repository.get("id")) is int
                                      and repository["id"] == int(os.environ["GITHUB_REPOSITORY_ID"])
                                  )
                  verified = installation_matches and scope_matches
          except Exception:
              # No API payload, exception text, request headers, token or JWT is logged.
              verified = False
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              for key, value in (
                  ("installation_matches", installation_matches),
                  ("single_repo_scope_matches", scope_matches),
                  ("identity_verified", verified),
              ):
                  output.write(f"{key}={str(value).lower()}\n")
          if not verified:
              print("PUBLISHER_IDENTITY_VERIFICATION_FAILED")
              raise SystemExit(1)
          print("PUBLISHER_IDENTITY_VERIFIED")
          PY
      - name: Report publisher identity-only result
        id: publisher_identity_summary
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.identity_only }}
        env:
          APP_ID_MATCHES: ${{ steps.publisher_identity_preflight.outputs.app_id_matches }}
          INSTALLATION_MATCHES: ${{ steps.publisher_identity_verify.outputs.installation_matches }}
          SINGLE_REPO_SCOPE_MATCHES: ${{ steps.publisher_identity_verify.outputs.single_repo_scope_matches }}
          IDENTITY_VERIFIED: ${{ steps.publisher_identity_verify.outputs.identity_verified }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = {
              "app_id_matches": os.environ.get("APP_ID_MATCHES") == "true",
              "installation_matches": os.environ.get("INSTALLATION_MATCHES") == "true",
              "single_repo_scope_matches": os.environ.get("SINGLE_REPO_SCOPE_MATCHES") == "true",
              "identity_verified": os.environ.get("IDENTITY_VERIFIED") == "true",
              "published": False,
          }
          serialized = json.dumps(result, sort_keys=True)
          print(serialized)
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as output:
              output.write("Publisher identity-only result (no data published):\n" + serialized + "\n")
          PY
      - uses: actions/checkout@v6
        if: ${{ !inputs.identity_only }}
      - uses: actions/setup-python@v6
        if: ${{ !inputs.identity_only }}
        with:
          python-version: "3.11"
      - name: Install package
        if: ${{ !inputs.identity_only }}
        run: python -m pip install -e .
      - name: Build theme momentum snapshot
        if: ${{ !inputs.identity_only }}
        env:
          INPUT_AS_OF: ${{ github.event.inputs.as_of || '' }}
          PRICES_PATH: ${{ github.event.inputs.prices_path || '' }}
          STRICT_DOWNLOADS: ${{ github.event.inputs.strict_downloads || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p data/output
          ARGS=(--output data/output/theme_momentum_snapshot.json)
          if [ -n "${INPUT_AS_OF}" ]; then
            ARGS+=(--as-of "${INPUT_AS_OF}")
          fi
          if [ -n "${PRICES_PATH}" ]; then
            ARGS+=(--prices "${PRICES_PATH}")
          fi
          if [ "${STRICT_DOWNLOADS}" = "true" ]; then
            ARGS+=(--strict-downloads)
          fi
          python scripts/build_theme_momentum_snapshot.py "${ARGS[@]}" | tee /tmp/theme_momentum_summary.json
          {
            echo "## Theme momentum snapshot"
            echo ""
            echo '```json'
            cat /tmp/theme_momentum_summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit snapshot
        if: ${{ !inputs.identity_only }}
        env:
          COMMIT_OUTPUTS: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.commit_outputs || 'false' }}
        run: |
          set -euo pipefail
          if [ "${COMMIT_OUTPUTS}" != "true" ]; then
            echo "Snapshot commit disabled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/output/theme_momentum_snapshot.json
          if git diff --cached --quiet; then
            echo "No theme momentum changes to commit."
          else
            git commit -m "Update theme momentum snapshot [skip ci]"
            push_log="$(mktemp)"
            if git push 2>"${push_log}"; then
              rm -f "${push_log}"
            else
              if grep -Fq 'GH013: Repository rule violations found for refs/heads/main' "${push_log}" && grep -Eqi 'required status check' "${push_log}"; then
                echo "Push blocked by repository rules; keeping artifact-only output."
                cat "${push_log}"
                rm -f "${push_log}"
              else
                cat "${push_log}" >&2
                rm -f "${push_log}"
                exit 1
              fi
            fi
          fi
      - name: Upload theme momentum artifact
        if: ${{ !inputs.identity_only }}
        uses: actions/upload-artifact@v7
        with:
          name: theme-momentum-snapshot
          path: data/output/theme_momentum_snapshot.json
          if-no-files-found: error
